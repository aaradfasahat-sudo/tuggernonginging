[build]
  publish = "."
  functions = "netlify/functions"

# Route /px to the serverless proxy function (must come before the SPA catch-all)
[[redirects]]
  from = "/px"
  to = "/.netlify/functions/px"
  status = 200
  force = true

# Route /suggestions to the serverless suggestions function
[[redirects]]
  from = "/suggestions"
  to = "/.netlify/functions/suggestions"
  status = 200
  force = true

# Static pages (extensionless → .html)
[[redirects]]
  from = "/blackmarket"
  to = "/blackmarket.html"
  status = 200

[[redirects]]
  from = "/proxy"
  to = "/proxy.html"
  status = 200

[[redirects]]
  from = "/proxy1"
  to = "/proxy1.html"
  status = 200

[[redirects]]
  from = "/proxy2"
  to = "/proxy2.html"
  status = 200

# SPA catch-all — serve index.html for all other paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived cache for hashed asset bundles (JS / CSS)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for root-level files that can change
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/inject.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Moderate cache for theme songs
[[headers]]
  for = "/theme-songs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
