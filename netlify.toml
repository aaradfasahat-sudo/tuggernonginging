[build]
  publish = "."
  functions = "netlify/functions"
  environment = { NODE_VERSION = "20" }

# Short cache for hashed asset bundles — always revalidate to pick up new deploys
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Short cache for root-level files that can change
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/inject.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Moderate cache for theme songs
[[headers]]
  for = "/theme-songs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Rewards page must never be cached (was a stale-cache bug locally)
[[headers]]
  for = "/blackmarket*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Market page must never be cached
[[headers]]
  for = "/market*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Security headers for app pages (NOT proxy pages which need frame embedding)
[[headers]]
  for = "/"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
